# Publishes a release to PyPI and GitHub when a version tag (e.g. v0.3.0) is
# pushed. Each job gets only the permissions it needs:
#
#   build           checks the tag and builds the sdist and wheel with the
#                   hash-pinned tools in .github/build-requirements.txt;
#                   read-only token, no secrets
#   publish-pypi    uploads to PyPI with trusted publishing (OpenID Connect), so
#                   no API token is stored anywhere; runs in the "pypi"
#                   environment, which waits for a maintainer's approval
#   github-release  attests the files' build provenance and creates the GitHub
#                   release with the files and the notes from CHANGELOG.md
#
# PyPI trusted publisher: owner "techiaith", repository
# "techiaith-speech-normalizer", workflow "publish.yml", environment "pypi".
# See https://docs.pypi.org/trusted-publishers/

name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tagged commit is on main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag against main and the package version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "pyproject.toml version ($version) does not match the tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          citation=$(sed -n 's/^version: *//p' CITATION.cff | tr -d "\"'")
          if [ "$citation" != "$version" ]; then
            echo "CITATION.cff version ($citation) does not match pyproject.toml ($version)" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/build-requirements.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/techiaith-speech-normalizer
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The notes are this version's section of CHANGELOG.md.
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            /^## \[/ { if (found) exit; found = (index($0, heading) == 1); next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Attach the files while the release is a draft: once published, an
          # immutable release cannot be changed.
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false
