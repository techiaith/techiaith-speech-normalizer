[project]
name = "techiaith-speech-normalizer"
version = "0.2.0"
description = "Normalize Welsh speech transcriptions into standard written Welsh"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Uned Technolegau Iaith, Prifysgol Bangor / Language Technologies Unit, Bangor University"},
]
keywords = ["welsh", "cymraeg", "nlp", "normalization", "speech", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/techiaith/techiaith-speech-normalizer"
Repository = "https://github.com/techiaith/techiaith-speech-normalizer"
Issues = "https://github.com/techiaith/techiaith-speech-normalizer/issues"
Changelog = "https://github.com/techiaith/techiaith-speech-normalizer/blob/main/CHANGELOG.md"

[project.scripts]
techiaith-speech-normalize = "techiaith.speech_normalizer.welsh_normalizer:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techiaith"]
